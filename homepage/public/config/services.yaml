# Public Homepage Services

- Shnetflix:
    - Shnetflix:
        icon: jellyfin.png
        href: https://tv.ashlasky.com
        description: Stream movies and TV shows
        widget:
          type: jellyfin
          url: https://tv.ashlasky.com
          key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}} # Add API key to .env file
          enableBlocks: true
          enableNowPlaying: false # Privacy - don't show what's playing

    - Request Content:
        icon: jellyseerr.png
        href: https://request.ashlasky.com
        description: Request movies and shows
        widget:
          type: jellyseerr
          url: https://request.ashlasky.com
          key: {{HOMEPAGE_VAR_JELLYSEERR_API_KEY}} # Add API key to .env file

- About:
    - Welcome to The Shloud:
        icon: mdi-server-network
        href: "#"
        description: |
          Hey there! Welcome to my personal homelab - a space where I host media services for friends and family while building and showcasing my DevOps skills.

          This entire infrastructure runs on self-hosted, open-source solutions:
          • Docker containers orchestrated across multiple servers
          • Automated with Traefik reverse proxy
          • Secured with Cloudflare
          • Monitored through Prometheus and Grafana
          
          It's a continuous learning project demonstrating infrastructure automation, container orchestration, and system reliability engineering.

          Whether you're here to stream your favorite shows or check out my technical work - enjoy exploring!

