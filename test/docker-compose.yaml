services:
  whoami:
    image: nginx
    container_name: test-whoami
    restart: unless-stopped
    
    networks:
      - traefik_public
    
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Router configuration
      - "traefik.http.routers.whoami.rule=Host(`test.ashlasky.com`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
      
      # Middlewares (public service)
      - "traefik.http.routers.whoami.middlewares=security-headers@file,compression@file"
      
      # Service configuration (whoami runs on port 80)
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  traefik_public:
    external: true
