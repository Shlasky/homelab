services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    env_file:
      - ../../.env.base
      # - .env
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik_admin

networks:
  traefik_admin:
    external: true
