services:
  super-productivity:
    image: johannesjo/super-productivity:latest
    env_file:
      - ../../.env.base
      - .env
    networks:
      - traefik_public
      - super-productivity
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.sp.rule=Host(`tasks.${DOMAIN}`) || Host(`todo.${DOMAIN}`)"
      - "traefik.http.routers.sp.entrypoints=websecure"
      - "traefik.http.routers.sp.tls=true"
      - "traefik.http.routers.sp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sp.middlewares=security-headers@file"
      - "traefik.http.services.sp.loadbalancer.server.port=80"

  # WebDAV sync server
  webdav:
    image: hacdias/webdav:latest
    volumes:
      - ./webdav.yaml:/config.yml:ro
      - ${WEBDAV_DATA_DIR:-./data}:/data
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.webdav.rule=Host(`webdav.${DOMAIN}`)"
      - "traefik.http.routers.webdav.entrypoints=websecure"
      - "traefik.http.routers.webdav.tls=true"
      - "traefik.http.routers.webdav.tls.certresolver=letsencrypt"
      - "traefik.http.routers.webdav.middlewares=security-headers@file"
      - "traefik.http.services.webdav.loadbalancer.server.port=2345"

networks:
  super-productivity:
    driver: bridge
  traefik_public:
    external: true
