services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage-admin
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../../../.env.base
      - .env
    networks:
      - traefik_admin

networks:
  traefik_admin:
    external: true
