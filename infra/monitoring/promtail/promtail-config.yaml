server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from all Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extract container image
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

      # Extract compose project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'namespace'

      # Extract compose service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Add server label
      - replacement: 'mothership'
        target_label: 'server'

      # Add job label
      - replacement: 'docker'
        target_label: 'job'

  # Scrape Traefik access logs
  - job_name: traefik
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik
          server: mothership
          __path__: /var/log/traefik/access.log
    pipeline_stages:
      # Parse JSON access logs
      - json:
          expressions:
            level: level
            method: RequestMethod
            path: RequestPath
            status: DownstreamStatus
            duration: Duration
            client_ip: ClientAddr
            router: RouterName
            service: ServiceName
      # Extract level
      - labels:
          level:
          method:
          status:
          router:
          service:
      # Add timestamp
      - timestamp:
          source: time
          format: RFC3339Nano
