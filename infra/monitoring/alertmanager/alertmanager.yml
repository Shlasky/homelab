    #     headers:
    #       Subject: 'Homelab Alert: {{ .GroupLabels.alertname }}'

  # Critical alerts receiver (same as default for now, can differentiate later)
  - name: 'critical'
    # Same configuration as 'default' or more urgent notification method

# Inhibition rules - prevent sending redundant alerts
inhibit_rules:
  # If instance is down, don't alert on high CPU/memory for that instance
  - source_match:
      severity: 'critical'
      alertname: 'InstanceDown'
    target_match:
      severity: 'warning'
    equal: ['instance']
