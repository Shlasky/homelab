global:
  resolve_timeout: 5m

# Templates for alert messages (optional, can add later)
# templates:
#   - '/etc/alertmanager/templates/*.tmpl'

route:
  # Default receiver for all alerts
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # Wait before sending notification for a group
  group_wait: 10s

  # Wait before sending notification about new alerts for the same group
  group_interval: 10s

  # Wait before sending notification again if alert persists
  repeat_interval: 12h

  # Child routes for specific alert types
  routes:
    # Critical alerts - send immediately
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 5m

    # Warning alerts - can wait a bit
    - match:
        severity: warning
      receiver: 'default'
      group_wait: 30s
      repeat_interval: 1h

    # Info alerts - low priority
    - match:
        severity: info
      receiver: 'default'
      repeat_interval: 24h

receivers:
  # Default receiver - configure your notification method here
  - name: 'default'
    # Uncomment and configure one or more:

