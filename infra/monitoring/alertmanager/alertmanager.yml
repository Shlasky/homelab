    #     message: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

    # Email
    # email_configs:
    #   - to: 'your-email@example.com'
    #     from: 'alertmanager@homelab.local'
    #     smarthost: 'smtp.gmail.com:587'
