services:
  runner:
    image: myoung34/github-runner
    restart: always
    env_file:
      - ../../../.env.base
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/tmp/runner
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
