services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ../../../.env.base
      - .env
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - ../../../.env.base
      - .env
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - postgres
      - traefik_admin
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    env_file:
      - ../../../.env.base
      - .env
    networks:
      - postgres
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy

networks:
  postgres:
    name: postgres
    driver: bridge
  traefik_admin:
    external: true
  monitoring:
    external: true
