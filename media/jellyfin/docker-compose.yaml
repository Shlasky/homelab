services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    env_file:
      - ../../.env.base
      - .env
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/media/jellyfin/media:/media:ro  # Read-only for safety
    networks:
      - traefik_public
    devices:
      - /dev/dri:/dev/dri  # For Intel GPU transcoding

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    env_file:
      - ../../.env.base
      - .env
    volumes:
      - ./jellyseerr/config:/app/config
    networks:
      - traefik_public
      - traefik_admin

networks:
  traefik_public:
    external: true
  traefik_admin:
    external: true
