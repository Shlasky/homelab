services:
  # Prowlarr - Indexer Manager (should be first, others depend on it)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
    networks:
      - traefik_admin

  # Radarr - Movie Management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./radarr:/config
      - /mnt/media/jellyfin/media/movies:/movies
      - /mnt/downloads:/downloads
    networks:
      - traefik_admin
    depends_on:
      - prowlarr

  # Sonarr - TV Show Management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./sonarr:/config
      - /mnt/media/jellyfin/media/shows:/tv
      - /mnt/downloads:/downloads
    networks:
      - traefik_admin
    depends_on:
      - prowlarr

  # Bazarr - Subtitle Management
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./bazarr:/config
      - /mnt/media/jellyfin/media/movies:/movies
      - /mnt/media/jellyfin/media/shows:/tv
    networks:
      - traefik_admin
    depends_on:
      - radarr
      - sonarr


networks:
  traefik_admin:
    external: true
