services:
  # Prowlarr - Indexer Manager (should be first, others depend on it)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /srv/arr/prowlarr:/config
    networks:
      - traefik_admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`) || Host(`prowlarr.${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prowlarr.middlewares=security-headers@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  # Radarr - Movie Management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /srv/arr/radarr:/config
      - /mnt/media/jellyfin/media/movies:/movies
      - /mnt/downloads:/downloads
    networks:
      - traefik_admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`) || Host(`radarr.${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.radarr.middlewares=security-headers@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    depends_on:
      - prowlarr

  # Sonarr - TV Show Management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /srv/arr/sonarr:/config
      - /mnt/media/jellyfin/media/shows:/tv
      - /mnt/downloads:/downloads
    networks:
      - traefik_admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`) || Host(`sonarr.${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sonarr.middlewares=security-headers@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    depends_on:
      - prowlarr

  # Bazarr - Subtitle Management
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /srv/arr/bazarr:/config
      - /mnt/media/jellyfin/media/movies:/movies
      - /mnt/media/jellyfin/media/shows:/tv
    networks:
      - traefik_admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`) || Host(`bazarr.${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bazarr.middlewares=security-headers@file"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    depends_on:
      - radarr
      - sonarr


networks:
  traefik_admin:
    external: true
